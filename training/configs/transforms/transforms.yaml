transforms:
  - RandomResizedCrop: {size: InitInCode, scale: [0.3, 1], ratio: [1, 1], p: 0.3}
  - RandomGridShuffle: {grid: [3, 3], p: 0.2}
  - GaussianBlur: {blur_limit: [3, 10], sigma_limit: 0, p: 0.2}       # sigma_limit=0, then blur limit scale calcs sigma
  - GaussNoise: {var_limit: [10, 50], mean: 0, per_channel: True, noise_scale_factor: 1, p: 0.2}
  - PlanckianJitter: {mode: "blackbody", temperature_limit: [3000, 15000], sampling_method: "uniform", p: 0.2}
  - VerticalFlip: {p: 0.2}
  - HorizontalFlip: {p: 0.2}
  - Rotate: {limit: [-90, 90], p: 0.2}
  - RandomBrightnessContrast: {brightness_limit: [-0.2, 0.2], contrast_limit: [-0.2, 0.5], p: 0.2}
  - RandomFog: {alpha_coef: 0.2, fog_coef_range: [0.3, 1], p: 0.2}
  - ColorJitter: { brightness: [0.8, 1.2], contrast: [0.8, 1.2], saturation: [0.8, 1.2], hue: [-0.05, 0.05], p: 0.3 }
  - Normalize: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}    # ADE20k
  - Normalize: {mean: [0.418, 0.421, 0.399], std: [0.287, 0.275, 0.276]}    # oscd
